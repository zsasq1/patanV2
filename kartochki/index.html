<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Патанатомия: карточки (атласы)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c2306a'/%3E%3Ccircle cx='12' cy='13' r='4' fill='%234a3f9a'/%3E%3Ccircle cx='20' cy='19' r='3' fill='%234a3f9a'/%3E%3C/svg%3E">

<body data-page="cards" data-base="../">
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <a class="home" href="../">Патанатомия <span class="sub">итоговое занятие № 1, фото из открытых атласов</span></a>
      <div class="tools">
        <button class="btn icon" id="theme" type="button" aria-label="Сменить тему">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <nav class="switch" aria-label="Разделы">
      <a href="../#micro">Микро <span class="count">19</span></a>
      <a href="../#macro">Макро <span class="count">21</span></a>
      <a href="../voprosy/">Вопросы <span class="count">72</span></a>
      <a href="./" aria-current="page">Карточки</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="fc-head">
    <div class="switch" role="group" aria-label="Колода">
      <button type="button" data-deck="micro" aria-pressed="false">Микро <span class="count"></span></button>
      <button type="button" data-deck="macro" aria-pressed="false">Макро <span class="count"></span></button>

  </div>
  <div class="fc-progress"><span id="fc-count"></span><div class="track"><i id="fc-bar"></i></div></div>
  <div id="fc" aria-live="polite"></div>
</main>
<script src="../data/preparaty.js"></script>
